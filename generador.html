<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Generador de Invitaciones</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="generador.css">

</head>

<body>

    <div class="contenedor">

        <h1>Generador de Invitaciones</h1>

        <p class="subtitulo">
            Escribe una familia por bloque.
            Cada bloque generará un <strong>ID único</strong> y un enlace independiente.
        </p>

        <textarea
            id="nombres"
            placeholder="Ejemplo:

Jaime Arias
Guadalupe Juárez

Roberto Vargas
Mari Carmen Arias

Arturo Juárez
Eduwiges Treviño
Santiago Juárez"></textarea>

        <button id="generar">
            Generar invitaciones
        </button>

        <div id="resultado"></div>

    </div>

    <script src="generador.js"></script>

</body>

</html>
